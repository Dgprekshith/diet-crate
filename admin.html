<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diet Crate — Admin Panel</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#f4f6f9;color:#1a1a2e;min-height:100vh}
  .login{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#2b7a4b}
  .login-box{background:#fff;padding:2.5rem 2rem;border-radius:14px;width:100%;max-width:360px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.18)}
  .login-box h1{color:#2b7a4b;margin-bottom:1.2rem;font-size:1.5rem}
  .login-box input{width:100%;padding:.8rem 1rem;border:1.5px solid #ccc;border-radius:8px;font-size:1rem;margin-bottom:1rem}
  .login-box button{width:100%;padding:.85rem;background:#2b7a4b;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}
  .login-box button:hover{background:#236040}
  .login-box .err{color:red;font-size:.85rem;margin-top:.5rem}
  #app{display:none}
  header{background:#2b7a4b;color:#fff;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center}
  header h1{font-size:1.3rem}
  header button{background:rgba(255,255,255,.2);color:#fff;border:none;padding:.5rem 1.2rem;border-radius:6px;cursor:pointer;font-size:.9rem}
  .stats{display:flex;gap:1.2rem;padding:1.5rem 2rem;flex-wrap:wrap}
  .stat{background:#fff;border-radius:10px;padding:1.2rem 1.8rem;flex:1;min-width:140px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
  .stat .num{font-size:2rem;font-weight:700;color:#2b7a4b}
  .stat .lbl{font-size:.82rem;color:#666;margin-top:.2rem}
  .filters{display:flex;gap:.8rem;padding:0 2rem 1rem;flex-wrap:wrap;align-items:center}
  .filters input,.filters select{padding:.5rem .9rem;border:1.5px solid #ccc;border-radius:7px;font-size:.9rem}
  .filters button{padding:.5rem 1.1rem;background:#2b7a4b;color:#fff;border:none;border-radius:7px;cursor:pointer;font-size:.9rem}
  .table-wrap{overflow-x:auto;padding:0 2rem 2rem}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.07)}
  th{background:#2b7a4b;color:#fff;padding:.75rem 1rem;text-align:left;font-size:.85rem;font-weight:600}
  td{padding:.7rem 1rem;font-size:.88rem;border-bottom:1px solid #f0f0f0}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#f9fffe}
  .badge{display:inline-block;padding:.2rem .6rem;border-radius:20px;font-size:.75rem;font-weight:600}
  .badge.paid{background:#d4edda;color:#155724}
  .badge.pending{background:#fff3cd;color:#856404}
  .loading{text-align:center;padding:3rem;color:#888}
  @media(max-width:600px){.stats{flex-direction:column}.filters{flex-direction:column}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="loginScreen">
  <div class="login-box">
    <h1>🥗 Diet Crate Admin</h1>
    <input type="password" id="pwd" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Login</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <h1>🥗 Diet Crate — Orders</h1>
    <button onclick="doLogout()">Logout</button>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="sTotalOrders">—</div><div class="lbl">Total Orders</div></div>
    <div class="stat"><div class="num" id="sTotalRevenue">—</div><div class="lbl">Total Revenue (₹)</div></div>
    <div class="stat"><div class="num" id="sPaid">—</div><div class="lbl">Paid Orders</div></div>
  </div>

  <div class="filters">
    <input type="text" id="fSearch" placeholder="Search name / location…" oninput="renderTable()">
    <select id="fStatus" onchange="renderTable()">
      <option value="">All status</option>
      <option value="paid">Paid</option>
      <option value="pending">Pending</option>
    </select>
    <select id="fBuilding" onchange="renderTable()">
      <option value="">All buildings</option>
      <option>Brigade Deccan Heights</option>
      <option>Brigade Twin Towers</option>
      <option>DNR Altitude</option>
      <option>Sattva</option>
    </select>
    <button onclick="loadOrders()">🔄 Refresh</button>
  </div>

  <div class="table-wrap">
    <div class="loading" id="loadingMsg">Loading orders…</div>
    <table id="ordersTable" style="display:none">
      <thead>
        <tr>
          <th>#</th>
          <th>Date &amp; Time</th>
          <th>Customer</th>
          <th>Building</th>
          <th>Amount (₹)</th>
          <th>Status</th>
          <th>Payment ID</th>
        </tr>
      </thead>
      <tbody id="ordersBody"></tbody>
    </table>
  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const ADMIN_PASSWORD = "dietcrate@admin2026"; // ← change this password

  const app = initializeApp({
    apiKey: "YOUR_FIREBASE_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
  });
  const db = getFirestore(app);

  let allOrders = [];

  window.doLogin = function() {
    const pwd = document.getElementById('pwd').value;
    if (pwd === ADMIN_PASSWORD) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadOrders();
    } else {
      document.getElementById('loginErr').textContent = 'Wrong password.';
    }
  };

  window.doLogout = function() {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    document.getElementById('pwd').value = '';
  };

  window.loadOrders = async function() {
    document.getElementById('loadingMsg').style.display = 'block';
    document.getElementById('ordersTable').style.display = 'none';
    try {
      const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
      const snap = await getDocs(q);
      allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      updateStats();
      renderTable();
    } catch(e) {
      document.getElementById('loadingMsg').textContent = 'Error loading orders. Check Firebase config.';
    }
  };

  window.updateStats = function() {
    const paid = allOrders.filter(o => o.status === 'paid');
    const rev  = paid.reduce((s, o) => s + (parseInt(o.amountINR) || 0), 0);
    document.getElementById('sTotalOrders').textContent = allOrders.length;
    document.getElementById('sTotalRevenue').textContent = '₹' + rev.toLocaleString('en-IN');
    document.getElementById('sPaid').textContent = paid.length;
  };

  window.renderTable = function() {
    const search   = (document.getElementById('fSearch').value || '').toLowerCase();
    const status   = document.getElementById('fStatus').value;
    const building = document.getElementById('fBuilding').value;

    let filtered = allOrders.filter(o => {
      const matchSearch   = !search   || (o.customerName||'').toLowerCase().includes(search) || (o.location||'').toLowerCase().includes(search);
      const matchStatus   = !status   || o.status === status;
      const matchBuilding = !building || (o.location||'').includes(building);
      return matchSearch && matchStatus && matchBuilding;
    });

    const tbody = document.getElementById('ordersBody');
    tbody.innerHTML = '';
    filtered.forEach((o, i) => {
      const date = o.createdAt?.toDate ? o.createdAt.toDate().toLocaleString('en-IN') : '—';
      tbody.innerHTML += `
        <tr>
          <td>${i+1}</td>
          <td>${date}</td>
          <td>${o.customerName || '—'}</td>
          <td>${o.location || '—'}</td>
          <td>₹${(o.amountINR||0).toLocaleString('en-IN')}</td>
          <td><span class="badge ${o.status||'pending'}">${o.status||'pending'}</span></td>
          <td style="font-size:.78rem;color:#666">${o.paymentId||'—'}</td>
        </tr>`;
    });

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#888;padding:2rem">No orders found.</td></tr>';
    }
    document.getElementById('loadingMsg').style.display = 'none';
    document.getElementById('ordersTable').style.display = 'table';
  };
</script>
</body>
</html>
